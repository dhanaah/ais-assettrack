<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>AIS AssetTrack</title>
<link rel="icon" type="image/png" href="/static/favicon.png"><link rel="apple-touch-icon" href="/static/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@600;700&display=swap">
<style>
:root{--fg:#0f172a;--mute:#475569;--glass:rgba(255,255,255,.55);--glass2:rgba(255,255,255,.35);--edge:rgba(255,255,255,.65);--line:rgba(15,23,42,.08);--shadow:0 10px 30px rgba(15,23,42,.10);
--accent:#0ea5e9;--accent-d:#0369a1;--violet:#7c3aed;--pink:#ec4899;--ok:#059669;--ok-2:rgba(16,185,129,.18);--warn:#dc2626;--warn-2:rgba(239,68,68,.16);--amber:#d97706;--amber-2:rgba(245,158,11,.18);--info-2:rgba(14,165,233,.18);--grey-2:rgba(100,116,139,.16)}
*{box-sizing:border-box}
body{margin:0;font-family:Inter,"Segoe UI",system-ui,sans-serif;font-size:14px;color:var(--fg);min-height:100vh;background:#eef2ff;background-image:radial-gradient(1200px 600px at -10% -10%,#c7d2fe 0%,transparent 60%),radial-gradient(900px 500px at 110% 0%,#a5f3fc 0%,transparent 55%),radial-gradient(900px 600px at 50% 120%,#fbcfe8 0%,transparent 55%),linear-gradient(135deg,#e0e7ff,#ecfeff 50%,#fdf2f8);background-attachment:fixed}
header{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:12px;padding:10px 22px;background:linear-gradient(90deg,rgba(30,58,138,.92),rgba(220,38,38,.85));backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);color:#fff;box-shadow:0 6px 24px rgba(79,70,229,.25);border-bottom:1px solid rgba(255,255,255,.35)}
header h1{font-family:Outfit,Inter,sans-serif;font-size:19px;margin:0;font-weight:700;letter-spacing:.2px}header .sp{flex:1}header small{opacity:.9;font-size:12.5px}
nav{position:sticky;top:53px;z-index:6;display:flex;flex-wrap:wrap;gap:6px;padding:10px 22px;background:var(--glass2);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--edge)}
nav button{background:rgba(255,255,255,.45);border:1px solid var(--edge);padding:7px 14px;border-radius:999px;cursor:pointer;font:inherit;font-size:13px;color:var(--fg);font-weight:500;transition:.15s}
nav button:hover{background:rgba(255,255,255,.8);transform:translateY(-1px)}
nav button.on{background:linear-gradient(90deg,#1e3a8a,#dc2626);color:#fff;border-color:transparent;box-shadow:0 6px 16px rgba(124,58,237,.35)}
main{padding:18px 22px;max-width:1540px;margin:0 auto}
.card{background:var(--glass);backdrop-filter:blur(16px) saturate(140%);-webkit-backdrop-filter:blur(16px) saturate(140%);border:1px solid var(--edge);border-radius:16px;padding:16px 18px;margin-bottom:16px;box-shadow:var(--shadow)}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:end}
label{display:flex;flex-direction:column;gap:4px;font-size:11.5px;color:var(--mute);font-weight:500}
input,select,textarea{font:inherit;padding:8px 10px;border:1px solid rgba(15,23,42,.12);border-radius:10px;background:rgba(255,255,255,.75);color:var(--fg);min-width:130px;outline:none;transition:.15s}
input:focus,select:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(14,165,233,.2)}
button.p{background:linear-gradient(90deg,#1e3a8a,#dc2626);color:#fff;border:none;padding:9px 16px;border-radius:10px;cursor:pointer;font:inherit;font-weight:600;box-shadow:0 6px 16px rgba(124,58,237,.3);transition:.15s}
button.p:hover{transform:translateY(-1px);box-shadow:0 10px 22px rgba(124,58,237,.38)}
button.s{background:rgba(255,255,255,.7);color:var(--accent-d);border:1px solid rgba(14,165,233,.35);padding:6px 12px;border-radius:9px;cursor:pointer;font:inherit;font-weight:500;margin:1px 2px}
button.s:hover{background:#fff}
button.d{background:linear-gradient(90deg,#f43f5e,#ec4899);color:#fff;border:none;padding:6px 12px;border-radius:9px;cursor:pointer;font:inherit}
table{border-collapse:separate;border-spacing:0;width:100%;font-size:13px}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{background:rgba(255,255,255,.6);backdrop-filter:blur(8px);font-weight:600;position:sticky;top:0;color:var(--mute);font-size:12px;letter-spacing:.3px;text-transform:uppercase}
tbody tr:hover td{background:rgba(255,255,255,.45)}
.tw{overflow:auto;max-height:65vh;border-radius:10px}
.pill{display:inline-block;padding:2px 10px;border-radius:999px;font-size:11px;font-weight:700;letter-spacing:.3px}
.AVAILABLE,.APPLIED,.DONE,.OK,.CONFIRMED,.PDI_OK,.EMPTY,.AUTO_CORRECTED{background:var(--ok-2);color:var(--ok)}.AT_CUSTOMER,.OPEN,.IN_GATE,.LOADED,.CUSTOMER,.STOCK_TRANSFER,.PICKED,.SENT{background:var(--info-2);color:var(--accent-d)}
.ALLOCATED,.IN_RETURN,.IN_TRANSIT,.IN_WIP,.RESERVED,.PDI_PENDING,.PDI_TXN_PENDING,.EMPTY_RETURN,.ALERT,.READY,.SO_PENDING,.CHALLANED,.APPROVED,.PENDING_VERIFICATION,.RECEIVING,.PENDING,.EXCEPTION{background:var(--amber-2);color:var(--amber)}
.HELD,.DAMAGED,.REJECTED,.REJECT,.MISSING,.BLOCKED,.CANCELLED,.FAILED,.OVERDUE,.FOREIGN,.SHORT,.UNKNOWN,.CROSS_CUSTOMER,.EXCESS{background:var(--warn-2);color:var(--warn)}
.DISCONTINUED,.CLOSED,.DISPATCHED,.PALLET_ONLY,.UNDER_REPAIR,.SYSTEM{background:var(--grey-2);color:#334155}.WEB{background:var(--info-2);color:var(--accent-d)}.HHT{background:var(--ok-2);color:var(--ok)}.EXT{background:rgba(124,58,237,.16);color:#6d28d9}
.kpis{display:flex;flex-wrap:nowrap;gap:10px;margin-bottom:16px;overflow-x:auto;padding-bottom:2px}.kpis>.kpi{flex:1 1 0;min-width:96px}
.kpi{position:relative;overflow:hidden;z-index:0;background:var(--glass);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--edge);border-radius:14px;padding:10px 12px 10px 14px;box-shadow:var(--shadow)}
.kpi::before{content:"";position:absolute;inset:0 auto 0 0;width:5px;background:var(--kc,var(--accent))}
.kpi b{font-family:Outfit,Inter,sans-serif;font-size:24px;display:block;line-height:1.1}.kpi span{font-size:10.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block;color:var(--mute);font-weight:600;letter-spacing:.4px}
.kpi:nth-child(1){--kc:#10b981}.kpi:nth-child(2){--kc:#f59e0b}.kpi:nth-child(3){--kc:#0ea5e9}.kpi:nth-child(4){--kc:#8b5cf6}.kpi:nth-child(5){--kc:#f43f5e}.kpi:nth-child(6){--kc:#ef4444}.kpi:nth-child(7){--kc:#64748b}.kpi:nth-child(8){--kc:#0ea5e9}.kpi:nth-child(9){--kc:#a855f7}
#msg{position:fixed;right:20px;bottom:20px;background:rgba(15,23,42,.9);backdrop-filter:blur(10px);color:#fff;padding:11px 16px;border-radius:12px;display:none;max-width:440px;z-index:9;box-shadow:0 10px 30px rgba(0,0,0,.3)}
#msg.err{background:rgba(220,38,38,.92)}
h2{font-family:Outfit,Inter,sans-serif;font-size:17px;margin:0 0 12px;font-weight:700}h3{font-size:12px;margin:14px 0 6px;color:var(--mute);text-transform:uppercase;letter-spacing:.5px}
.login{max-width:380px;margin:70px auto;text-align:center}.login input{width:100%}.login h2{font-size:22px}.login button{width:100%;margin-top:14px}

footer{text-align:center;color:var(--mute);font-size:11.5px;padding:16px}
.muted{color:var(--mute);font-size:12px}
pre{background:rgba(255,255,255,.6);padding:10px;border-radius:10px;white-space:pre-wrap}
@media (prefers-color-scheme:dark){:root{--fg:#e2e8f0;--mute:#94a3b8;--glass:rgba(17,24,39,.55);--glass2:rgba(17,24,39,.4);--edge:rgba(255,255,255,.12);--line:rgba(255,255,255,.08);--shadow:0 10px 30px rgba(0,0,0,.35)}
 body{background:#0b1020;background-image:radial-gradient(1200px 600px at -10% -10%,#312e81 0%,transparent 60%),radial-gradient(900px 500px at 110% 0%,#164e63 0%,transparent 55%),radial-gradient(900px 600px at 50% 120%,#831843 0%,transparent 55%)}
 input,select,textarea{background:rgba(15,23,42,.7);color:var(--fg);border-color:rgba(255,255,255,.12)}th{background:rgba(17,24,39,.7)}tbody tr:hover td{background:rgba(255,255,255,.05)}button.s{background:rgba(15,23,42,.6);color:#7dd3fc}pre{background:rgba(15,23,42,.6)}}
.dd{position:relative}.dd .car{margin-left:6px;font-size:10px;opacity:.7}
.dd .menu{display:none;position:absolute;top:calc(100% + 6px);left:0;min-width:190px;background:rgba(255,255,255,.97);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid var(--edge);border-radius:12px;box-shadow:var(--shadow);padding:6px;z-index:20;flex-direction:column;gap:2px}
.dd.open .menu{display:flex}.dd .menu button{border:none;background:none;border-radius:8px;text-align:left;padding:8px 12px;width:100%}
.dd .menu button:hover{background:rgba(14,165,233,.12)}.dd .menu button.sel{background:linear-gradient(90deg,#1e3a8a,#dc2626);color:#fff}
@media (prefers-color-scheme:dark){.dd .menu{background:rgba(17,24,39,.95)}}
.chk{display:flex!important;flex-direction:row!important;justify-content:flex-start!important;align-items:center;gap:8px;font-weight:400;margin:4px 0;text-transform:none;letter-spacing:0;font-size:13px}.chk input{width:auto!important;flex:0 0 auto;margin:0}
input[type=checkbox],input[type=radio]{min-width:0;width:16px;height:16px;padding:0;accent-color:#1e3a8a}
.rolebox{display:flex;flex-wrap:wrap;gap:8px}.rolechip{border:1px solid var(--edge);border-radius:999px;padding:6px 12px!important;background:var(--glass);cursor:pointer}.rolechip:has(input:checked){background:linear-gradient(90deg,#1e3a8a,#dc2626);color:#fff;border-color:transparent}
</style>
</head>
<body>
<header><img src="/static/icon-on-dark.png" alt="AIS" style="height:46px"><img src="/static/wordmark-on-dark.png" alt="AssetTrack" style="height:38px"><small id="who"></small><span class="sp"></span><small id="ver"></small><button class="s" id="logout" style="display:none">Logout</button></header>
<nav id="nav" style="display:none"></nav>
<main id="main"></main>
<footer>AIS AssetTrack · Developed by DT · Asahi India Glass Ltd. · <span id="ver2"></span></footer>
<div id="msg"></div>
<script>
const API='/api/v1';let T=localStorage.getItem('tok'),ME=null,PAGE='dash';
const $=s=>document.querySelector(s);const h=(t,a={},...c)=>{const e=document.createElement(t);for(const k in a){if(k==='on')for(const ev in a.on)e.addEventListener(ev,a.on[ev]);else if(k==='html')e.innerHTML=a[k];else if(k in e&&k!=='style')e[k]=a[k];else e.setAttribute(k,a[k])}c.flat().forEach(x=>e.append(x instanceof Node?x:document.createTextNode(x??'')));return e};
function msg(t,err){const m=$('#msg');m.textContent=t;m.className=err?'err':'';m.style.display='block';clearTimeout(m._t);m._t=setTimeout(()=>m.style.display='none',err?6000:3000)}
async function api(path,opt={}){const o={method:opt.method||'GET',headers:{'X-Device-Id':'WEB-'+(navigator.userAgent.match(/(Chrome|Edg|Firefox)\/\d+/)||['browser'])[0].replace('/','')}};if(T)o.headers.Authorization='Bearer '+T;if(opt.body instanceof FormData)o.body=opt.body;else if(opt.body){o.headers['Content-Type']='application/json';o.body=JSON.stringify(opt.body)}
 const r=await fetch(API+path,o);if(r.status===401){logout();throw new Error('Login required')}const j=await r.json().catch(()=>({}));if(!r.ok){throw new Error(j.detail?(typeof j.detail==='string'?j.detail:JSON.stringify(j.detail)):r.statusText)}return j}
function logout(){T=null;localStorage.removeItem('tok');ME=null;render()}
function pill(s){return h('span',{className:'pill '+s},s||'')}
function fmt(d){return d?String(d).replace('T',' ').slice(0,16):''}
function table(cols,rows,act){const t=h('table',{},h('thead',{},h('tr',{},cols.map(c=>h('th',{},c[0])),act?h('th',{},''):'')));const tb=h('tbody');rows.forEach(r=>tb.append(h('tr',{},cols.map(c=>h('td',{},typeof c[1]==='function'?c[1](r):(r[c[1]]??''))),act?h('td',{},act(r)):'')));t.append(tb);return h('div',{className:'tw'},t)}
function field(lbl,name,val='',type='text',extra={}){const i=type==='select'?h('select',{name,...extra},extra.opts.map(o=>h('option',{value:o[0],selected:o[0]==val},o[1]))):h('input',{name,value:val,type,...extra});return h('label',{},lbl,i)}
function formData(f){const o={};new FormData(f).forEach((v,k)=>{o[k]=v});f.querySelectorAll('input[type=checkbox]').forEach(c=>o[c.name]=c.checked);return o}

const PAGES=[['dash','Dashboard',null],['pallets','Pallets',null],['picklists','Pick Lists',null],['pdi','PDI Status',null],['stock','WMS Stock & LPN',null],['moves','Zones (in plant)',null],['misses','Missed Scans',null],['position','Plant Position',['REPORTS_PLANT','REPORTS_ALL']],['live','Live Transactions',['REPORTS_PLANT','REPORTS_ALL']],['slips','Return Slips',null],['blankets','Blanket & Sub-inv',null],['bench','HMIL Bench link',['INTEGRATION_CONFIG','REPORTS_ALL']],['masters','Masters','GLOBAL_MASTERS'],['users','Users',['PLANT_USERS_ADMIN','INTEGRATION_CONFIG','USER_ADMIN']],['import','Import','GLOBAL_MASTERS'],['sync','Sync Monitor',['AUDIT_LOG','REPORTS_ALL','PLANT_USERS_ADMIN']],['reports','Reports',null],['audit','Audit',['AUDIT_LOG']],['activity','Activity',['AUDIT_LOG','REPORTS_ALL','PLANT_USERS_ADMIN','REPORTS_PLANT']]];
const GROUPS=[['Dashboard',['dash']],['Operations',['picklists','pdi','slips','pallets']],['Stock & Movement',['stock','moves','misses']],['Monitor',['position','live']],['Masters',['masters','blankets','users','import','bench']],['Audit',['activity','sync','reports','audit']]];
function can(p){if(!p)return true;return (Array.isArray(p)?p:[p]).some(x=>ME.perms.includes(x))}

async function render(){
 const m=$('#main');m.innerHTML='';
 if(!T){$('#nav').style.display='none';$('#logout').style.display='none';$('#who').textContent='';
  const f=h('form',{className:'card login'},h('img',{src:'/static/icon-192.png',alt:'AIS',style:'height:70px;margin:0 auto 6px;display:block'}),h('img',{src:'/static/wordmark.png',alt:'AssetTrack',style:'max-width:280px;margin:0 auto 12px;display:block'}),h('h2',{},'Sign in'),field('User ID','user_id'),h('br'),field('Password','password','','password'),h('br'),h('button',{className:'p',type:'submit'},'Login'));
  f.onsubmit=async e=>{e.preventDefault();try{const d=formData(f);const r=await api('/auth/login',{method:'POST',body:{...d,device_id:'WEB'}});T=r.token;localStorage.setItem('tok',T);if(r.must_change_pw)msg('Please change your password (Users > My account)');render()}catch(x){msg(x.message,1)}};
  m.append(f);return}
 try{ME=await api('/auth/me')}catch{return}
 $('#who').textContent=`${ME.name} · ${ME.plant||'ALL PLANTS'} · ${ME.roles.join(', ')}`;$('#logout').style.display='';
 const nav=$('#nav');nav.style.display='';nav.innerHTML='';
 GROUPS.forEach(([g,ids])=>{const items=ids.map(id=>PAGES.find(p=>p[0]===id)).filter(p=>can(p[2]));if(!items.length)return;
  if(items.length===1&&ids.length===1){nav.append(h('button',{className:PAGE===items[0][0]?'on':'',on:{click:()=>{PAGE=items[0][0];render()}}},items[0][1]));return}
  const cur=items.find(p=>p[0]===PAGE);const dd=h('div',{className:'dd'+(cur?' on':'')},h('button',{className:cur?'on':'',on:{click:e=>{e.stopPropagation();document.querySelectorAll('.dd.open').forEach(x=>x!==dd&&x.classList.remove('open'));dd.classList.toggle('open')}}},g+(cur?' · '+cur[1]:''),h('span',{className:'car'},'▾')),h('div',{className:'menu'},items.map(p=>h('button',{className:PAGE===p[0]?'sel':'',on:{click:()=>{PAGE=p[0];render()}}},p[1]))));nav.append(dd)});
 document.body.onclick=()=>document.querySelectorAll('.dd.open').forEach(x=>x.classList.remove('open'));
 m.append(h('div',{className:'muted',style:'margin:-4px 0 10px;font-size:12px'},'📱 Scans, movements, PDI, gate and return operations are done on the HHT only. This web is for masters, uploads, release & challan, reports, live view and monitoring.'));
 try{await ({dash,pallets,picklists,slips,masters,users,imp,sync,reports,audit,activity,pdi,stock,moves,misses,blankets,position,live,bench})[PAGE==='import'?'imp':PAGE](m)}catch(x){m.append(h('div',{className:'card'},'Error: '+x.message))}
}
$('#logout').onclick=logout;

async function dash(m){
 if(ME.plant){try{const [z,w,ms]=await Promise.all([api('/zones'),api('/wms/status'),api('/scan-misses/summary')]);const open=ms.reduce((a,x)=>a+x.open,0);
  m.append(h('div',{className:'kpis'},...Object.entries(z.zones).map(([k,v])=>h('div',{className:'kpi'},h('b',{},(v.LOADED||0)+' / '+(v.EMPTY||0)),h('span',{},k+' · LOADED / EMPTY'))),
   h('div',{className:'kpi',style:w.stale?'border:2px solid var(--warn)':''},h('b',{},w.age_hours==null?'—':w.age_hours+' h'),h('span',{},'WMS STOCK AGE'+(w.stale?' · UPLOAD NOW':''))),
   h('div',{className:'kpi',style:open?'border:2px solid var(--warn)':''},h('b',{},open),h('span',{},'MISSED SCANS OPEN'))));
  if(z.yard_loaded_violations)msg(z.yard_loaded_violations+' LOADED pallet(s) shown in Pallet Yard - check',1)}catch(x){}}
 const av=await api('/reports/availability'),hold=await api('/reports/customer-holding'),tot={};
 for(const p in av)for(const s in av[p])tot[s]=(tot[s]||0)+av[p][s];
 m.append(h('div',{className:'kpis'},['AVAILABLE','ALLOCATED','AT_CUSTOMER','IN_RETURN','IN_TRANSIT','HELD','IN_WIP','DAMAGED'].map(s=>h('div',{className:'kpi'},h('b',{},tot[s]||0),h('span',{},s.replace('_',' '))))));
 m.append(h('div',{className:'card'},h('h2',{},'Plant-wise availability'),table([['Plant','plant'],...['AVAILABLE','ALLOCATED','AT_CUSTOMER','IN_RETURN','HELD','HELD_FROM_OTHER','DAMAGED','UNDER_REPAIR','DISCONTINUED'].map(s=>[s.replace(/_/g,' '),r=>r[s]||''])],Object.keys(av).sort().map(p=>({plant:p,...av[p]})))));
 m.append(h('div',{className:'card'},h('h2',{},'Customer holding & aging'),table([['Plant','plant'],['Customer','customer'],['Name','name'],['Qty','qty'],['0-30','b0_30'],['31-60','b31_60'],['61+','b61'],['Max days','max_days'],['Limit','limit_days'],['',r=>r.overdue?pill('OVERDUE'):'']],hold)));
}

async function pallets(m){
 const plants=ME.plant?[]:await api('/plants');
 const f=h('form',{className:'row'},ME.plant?'':field('Plant','plant','','select',{opts:[['','All plants'],...plants.map(x=>[x.code,x.code+' '+x.name])]}),h('label',{},'Own pallets only',h('input',{type:'checkbox',name:'home_only'})),field('Load','load','','select',{opts:[['','Any'],['LOADED','Loaded'],['EMPTY','Empty']]}),field('Zone','zone','','select',{opts:[['','Any'],['YARD','Yard'],['PRODUCTION','Production'],['FGWH','FGWH'],['PACKING','Packing']]}),field('Search','q'),field('Status','status','','select',{opts:[['','All'],...['AVAILABLE','ALLOCATED','AT_CUSTOMER','IN_RETURN','IN_TRANSIT','HELD','IN_WIP','DAMAGED','UNDER_REPAIR','DISCONTINUED'].map(s=>[s,s])]}),field('Customer','customer'),h('button',{className:'p'},'Search'),h('button',{className:'s',type:'button',on:{click:()=>window.open(API+'/reports/export/pallets.xlsx?tok='+T)}},'Export'));
 const out=h('div');f.onsubmit=async e=>{e.preventDefault();const d=formData(f);if(!d.home_only)delete d.home_only;const q=new URLSearchParams(Object.fromEntries(Object.entries(d).filter(([k,v])=>v)));const r=await api('/pallets?'+q);out.innerHTML='';out.className='card';out.append(h('p',{className:'muted'},`${r.total} pallets`),table([['Pallet No','pallet_no'],['Home','home_plant'],['At plant','location_plant'],['Type','pallet_type'],['Tag','current_tag'],['Status',r=>pill(r.status)],['Load',r=>r.load_state?pill(r.load_state):''],['Zone','zone'],['Load ref','load_ref'],['Location','location_plant'],['Customer','customer_code'],['Dispatched',r=>fmt(r.dispatch_date)],['Challan','challan_ref'],['Pick list','picklist_no']],r.items,r=>h('button',{className:'s',on:{click:()=>palletDetail(r.pallet_no)}},'History')))};
 m.append(h('div',{className:'card'},h('h2',{},'Pallets'),f),out);f.requestSubmit();
 if(can('GLOBAL_MASTERS')){const nf=h('form',{className:'row'},field('Home plant','home_plant',ME.plant||''),field('Pallet No (blank = auto)','pallet_no'),field('Type','pallet_type'),field('Tag No','tag_no'),h('button',{className:'p'},'Register pallet'));nf.onsubmit=async e=>{e.preventDefault();try{const r=await api('/pallets',{method:'POST',body:formData(nf)});msg('Registered '+r.pallet_no);f.requestSubmit()}catch(x){msg(x.message,1)}};

 m.append(h('div',{className:'row',style:'align-items:flex-start'},h('div',{className:'card',style:'flex:1;min-width:300px'},h('h2',{},'By user'),table([['User','user'],['Actions','count'],['Last seen',x=>fmt(x.last)]],sum.by_user)),h('div',{className:'card',style:'flex:1;min-width:300px'},h('h2',{},'By device'),table([['Device','device'],['Actions','count'],['Last seen',x=>fmt(x.last)]],sum.by_device))));
}
async function audit(m){const r=await api('/reports/audit');m.append(h('div',{className:'card'},h('h2',{},'Audit log'),table([['Time',r=>fmt(r.ts)],['User','user_id'],['Plant','plant_code'],['Action','action'],['Entity','entity'],['ID','entity_id'],['Old',r=>(r.old_value||'').slice(0,120)],['New',r=>(r.new_value||'').slice(0,160)],['IP','ip']],r)))}

fetch(API+'/health').then(r=>r.json()).then(j=>{$('#ver').textContent='v'+j.version+' · '+j.integration_mode;$('#ver2').textContent='v'+j.version});
render();
