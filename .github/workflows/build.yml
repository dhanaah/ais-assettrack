name: AIS AssetTrack CI
on:
  push:
    branches: [main]
    tags: ['server-v*', 'hht-v*']
  pull_request:
jobs:
  server:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: server } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install -r requirements.txt -r requirements-build.txt
      - name: Code check (ruff - unused / undefined names, likely bugs)
        run: ruff check .
      - name: Test suite (pytest) - the build stops here if anything fails
        run: pytest
      - name: Process flow, process rules and review fixes - the build stops here if anything fails
        env: { PYTHONPATH: ".", PALLET_BENCH_SCHEDULER: "0", PALLET_PICKLIST_SOURCE: "APP" }
        run: |
          python tests/test_parts_flow.py
          python tests/audit_fixes_check.py
          python tests/process_rules_check.py
      - name: Import check + API smoke (SQLite, STUB integrations)
        run: |
          python -c "from app.main import app; print('import ok')"
          (python run.py > /tmp/srv.log 2>&1 &) ; sleep 5
          curl -sf http://127.0.0.1:8001/api/v1/health
          TOKEN=$(curl -sf -X POST http://127.0.0.1:8001/api/v1/auth/login -H 'Content-Type: application/json' -d '{"user_id":"admin","password":"Admin@123"}' | python -c "import sys,json;print(json.load(sys.stdin)['token'])")
          curl -sf http://127.0.0.1:8001/api/v1/plants -H "Authorization: Bearer $TOKEN"
      - name: Package server zip
        run: cd .. && zip -qr AIS_AssetTrack_Server.zip server -x "server/pallet.db*" "server/logs/*" "server/secret.key" "server/job.key"
      - uses: actions/upload-artifact@v4
        with: { name: server-package, path: AIS_AssetTrack_Server.zip }

  server-exe:
    needs: server
    permissions: { contents: write }      # attach the server EXE zip to a GitHub release
    runs-on: windows-latest
    defaults: { run: { working-directory: server } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install -r requirements.txt -r requirements-build.txt
      - run: pyinstaller --noconfirm assettrack_server.spec
      - name: Smoke test the EXE build (import only)
        shell: pwsh
        run: |
          Copy-Item README_SERVER_EXE.txt dist/AssetTrack_Server/
          if (!(Test-Path dist/AssetTrack_Server/AssetTrack_Server.exe)) { exit 1 }
          New-Item -ItemType Directory -Force ../smoke | Out-Null
          Copy-Item -Recurse dist/AssetTrack_Server ../smoke/
          $p = Start-Process -FilePath ../smoke/AssetTrack_Server/AssetTrack_Server.exe -WorkingDirectory ../smoke/AssetTrack_Server -PassThru
          Start-Sleep -Seconds 25
          try { $r = Invoke-WebRequest -UseBasicParsing http://127.0.0.1:8001/api/v1/health; Write-Host $r.Content; $ok = $r.StatusCode -eq 200 } catch { $ok = $false; Write-Host $_ }
          Get-Content ../smoke/AssetTrack_Server/assettrack_server.log -ErrorAction SilentlyContinue
          Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
          if (-not $ok) { exit 1 }
      - uses: actions/upload-artifact@v4
        with: { name: server-exe, path: server/dist/AssetTrack_Server }
      - name: Zip the server EXE for a direct download link (PCs without Python)
        if: github.ref == 'refs/heads/main'
        shell: pwsh
        run: |
          $v = (Select-String -Path app/config.py -Pattern 'APP_VERSION = "([^"]+)"').Matches[0].Groups[1].Value
          "SV=$v" | Out-File -Append $env:GITHUB_ENV
          Compress-Archive -Force -Path dist/AssetTrack_Server -DestinationPath ../AIS_AssetTrack_Server_EXE.zip
      - uses: actions/upload-artifact@v4
        if: github.ref == 'refs/heads/main'
        with: { name: server-exe-zip, path: AIS_AssetTrack_Server_EXE.zip }

  server-sqlserver:
    # Same checks as the server job, on a real SQL Server 2022 (the database of the IIS installation),
    # plus the SQLite -> SQL Server copy tool. Developed by DT
    needs: server
    runs-on: ubuntu-latest
    services:
      mssql:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env: { ACCEPT_EULA: 'Y', MSSQL_SA_PASSWORD: 'AisTest#2026x', MSSQL_PID: 'Developer' }
        ports: ['1433:1433']
    defaults: { run: { working-directory: server } }
    env:
      PALLET_TEST_MSSQL: "mssql+pyodbc://sa:AisTest%232026x@localhost:1433/{db}?driver=ODBC+Driver+18+for+SQL+Server&TrustServerCertificate=yes"
      PYTHONPATH: "."
      PALLET_BENCH_SCHEDULER: "0"
      PALLET_PICKLIST_SOURCE: "APP"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: ODBC Driver 18 for SQL Server
        run: |
          if ! odbcinst -q -d 2>/dev/null | grep -q "ODBC Driver 18"; then
            curl -sSL https://packages.microsoft.com/keys/microsoft.asc | sudo tee /etc/apt/trusted.gpg.d/microsoft.asc >/dev/null
            curl -sSL https://packages.microsoft.com/config/ubuntu/$(lsb_release -rs)/prod.list | sudo tee /etc/apt/sources.list.d/mssql-release.list >/dev/null
            sudo apt-get update -q && sudo ACCEPT_EULA=Y apt-get install -y -q msodbcsql18 unixodbc-dev
          fi
          odbcinst -q -d
      - run: pip install -r requirements.txt pyodbc==5.3.0
      - name: Wait for SQL Server
        run: |
          python - <<'PY'
          import time, pyodbc
          for i in range(60):
              try:
                  pyodbc.connect("DRIVER={ODBC Driver 18 for SQL Server};SERVER=localhost,1433;UID=sa;PWD=AisTest#2026x;TrustServerCertificate=yes", timeout=5).close(); print("SQL Server up"); break
              except Exception as e:
                  time.sleep(3)
          else:
              raise SystemExit("SQL Server did not start")
          PY
      - name: Process flow on SQL Server
        run: |
          python tests/test_parts_flow.py > out.txt 2>&1 && tail -2 out.txt || { python -c "import sys;t=open('out.txt',errors='replace').read().splitlines();b=[l for l in t if l.startswith('FAIL')][-15:]+t[-14:];print('::error::'+'%0A'.join(x.replace('%','%25') for x in b))"; exit 1; }
      - name: Process rules on SQL Server
        run: |
          python tests/process_rules_check.py > out.txt 2>&1 && tail -2 out.txt || { python -c "import sys;t=open('out.txt',errors='replace').read().splitlines();b=[l for l in t if l.startswith('FAIL')][-15:]+t[-14:];print('::error::'+'%0A'.join(x.replace('%','%25') for x in b))"; exit 1; }
      - name: Review fixes on SQL Server
        run: |
          python tests/audit_fixes_check.py > out.txt 2>&1 && tail -2 out.txt || { python -c "import sys;t=open('out.txt',errors='replace').read().splitlines();b=[l for l in t if l.startswith('FAIL')][-15:]+t[-14:];print('::error::'+'%0A'.join(x.replace('%','%25') for x in b))"; exit 1; }
      - name: Copy a filled SQLite database into SQL Server, then start the server on it
        run: |
          trap 'echo "::error::migration check failed at line $LINENO%0A$(tail -15 /tmp/step.log 2>/dev/null | sed "s/%/%25/g" | tr "\n" "\a" | sed "s/\a/%0A/g")"' ERR
          set -eE
          exec > >(tee /tmp/step.log) 2>&1
          mkdir -p /tmp/flow /tmp/target
          KEEP=/tmp/flow/pallet.db PALLET_TEST_MSSQL= python tests/test_parts_flow.py > /tmp/flow.log || { tail -20 /tmp/flow.log; false; }
          export PALLET_DB_URL=$(python -c "import sys; sys.path.insert(0,'tests'); from testdb import fresh_db_url; print(fresh_db_url('migr'))")
          python sql/migrate_sqlite_to_mssql.py /tmp/flow/pallet.db /tmp/target
          test -f /tmp/target/secret.key
          if python sql/migrate_sqlite_to_mssql.py /tmp/flow/pallet.db /tmp/target; then echo "second copy was NOT refused"; false; else echo "second copy refused (target not empty) - ok"; fi
          python - <<'PY'
          from fastapi.testclient import TestClient
          from app.main import app
          with TestClient(app) as c:
              h = c.get("/api/v1/health").json(); assert h["db"] == "ok", h
              r = c.post("/api/v1/auth/login", json={"user_id": "chn", "password": "x"}); assert r.status_code == 200, r.text
              n = len(c.get("/api/v1/pallets?limit=500", headers={"Authorization": "Bearer " + r.json()["token"]}).json().get("items", []))
              print("server started on the copied database, signed in, pallets:", n); assert n > 0
          PY

  server-portable:
    # Portable server: the official signed Python "embeddable" runtime + libraries + app in one folder.
    # No EXE built by us (antivirus-friendly), no install, no admin rights, no internet on the PC.
    needs: server
    permissions: { contents: write }
    runs-on: windows-latest
    env: { PYV: '3.12.10' }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12.10' }
      - name: Build the portable folder
        shell: pwsh
        run: |
          $root = "AssetTrack"; New-Item -ItemType Directory -Force "$root/python", "$root/scripts" | Out-Null
          Invoke-WebRequest -UseBasicParsing "https://www.python.org/ftp/python/$env:PYV/python-$env:PYV-embed-amd64.zip" -OutFile py.zip
          Expand-Archive py.zip "$root/python"
          # search path: stdlib zip, Lib (tkinter), site-packages, the app folder; "import site" enables the libraries
          Set-Content "$root/python/python312._pth" "python312.zip`n.`nLib`nLib\site-packages`n..\server`nimport site" -Encoding ascii
          python -m pip install --disable-pip-version-check --only-binary=:all: --target "$root/python/Lib/site-packages" -r server/requirements.txt pystray==0.19.5 pillow==13.0.0
          # tkinter (password box when stopping the server) is not in the embeddable runtime: copy it from the same Python version
          $py = Split-Path (Get-Command python).Source
          Copy-Item -Recurse "$py/Lib/tkinter" "$root/python/Lib/tkinter"
          Get-ChildItem "$py/DLLs" | Where-Object { $_.Name -match '^(_tkinter\.pyd|tcl.*\.dll|tk.*\.dll|zlib.*\.dll)$' } | ForEach-Object { Copy-Item $_.FullName "$root/python/"; Write-Host "copied $($_.Name)" }
          Copy-Item -Recurse "$py/tcl" "$root/python/tcl"
          # antivirus-friendly: drop the unsigned helper EXEs pip creates (never used) - only Microsoft / python.org signed EXEs remain
          Remove-Item -Recurse -Force "$root/python/Lib/site-packages/bin" -ErrorAction SilentlyContinue
          Get-ChildItem -Recurse "$root/python/Lib/site-packages" -Filter *.exe | Remove-Item -Force
          Get-ChildItem -Recurse "$root/python/tcl" -Filter *.exe | Remove-Item -Force
          $left = Get-ChildItem -Recurse "$root" -Filter *.exe | Where-Object { $_.Name -notin 'python.exe','pythonw.exe' }
          if ($left) { $left | ForEach-Object { Write-Output "::error::unsigned exe left: $($_.FullName)" }; exit 1 }
          Copy-Item -Recurse server "$root/server"
          Remove-Item -Recurse -Force "$root/server/tests", "$root/server/dist", "$root/server/build" -ErrorAction SilentlyContinue
          # developer / EXE-build files are not needed in the portable install
          Remove-Item -Force "$root/server/assettrack_server.spec", "$root/server/README_SERVER_EXE.txt", "$root/server/pytest.ini", "$root/server/requirements-build.txt" -ErrorAction SilentlyContinue
          Copy-Item AssetTrack_Server_App.bat, START_ASSETTRACK.bat, Restart_AssetTrack_Server.bat "$root/"
          Copy-Item -Recurse iis "$root/iis"          # IIS + SQL Server installation scripts (same zip, second way to host)
          Remove-Item -Force "$root/server/web.config" -ErrorAction SilentlyContinue   # written by iis\Setup_IIS.ps1 - never shipped, so updates keep it
          Copy-Item docs/PORTABLE_SERVER.txt "$root/README_PORTABLE.txt"
      - name: Smoke test with the portable Python only
        shell: pwsh
        working-directory: AssetTrack/server
        run: |
          $out = & ../python/python.exe -c "import sys; print(sys.path); import pystray, PIL, uvicorn, app.main; print('imports ok')" 2>&1 | Out-String
          Write-Host $out
          if ($LASTEXITCODE) { ($out -split "`n" | Select-Object -Last 8) | ForEach-Object { Write-Output "::error::$_" }; exit 1 }
          & ../python/python.exe -c "import tkinter; tkinter.Tcl(); print('tkinter ok')" 2>&1 | ForEach-Object { if ($_ -match 'ok') { Write-Host $_ } else { Write-Output "::warning::tkinter: $_" } }
          $p = Start-Process -FilePath ../python/python.exe -ArgumentList "run.py" -PassThru -WindowStyle Hidden -RedirectStandardError ../run_err.txt -RedirectStandardOutput ../run_out.txt
          Start-Sleep -Seconds 15
          try { $r = Invoke-WebRequest -UseBasicParsing http://127.0.0.1:8001/api/v1/health; Write-Host $r.Content; $ok = $r.StatusCode -eq 200 } catch { $ok = $false; Write-Host $_ }
          if (-not $ok) { Get-Content ../run_err.txt -Tail 10 -ErrorAction SilentlyContinue | ForEach-Object { Write-Output "::error::$_" } }
          Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
          Start-Sleep -Seconds 2
          Remove-Item -Force pallet.db*, secret.key, job.key, *.log -ErrorAction SilentlyContinue
          Remove-Item -Recurse -Force logs, backups, gcs_docs, slip_docs -ErrorAction SilentlyContinue
          if (-not $ok) { exit 1 }
      - name: Zip
        shell: pwsh
        run: |
          $v = (Select-String -Path server/app/config.py -Pattern 'APP_VERSION = "([^"]+)"').Matches[0].Groups[1].Value
          "SV=$v" | Out-File -Append $env:GITHUB_ENV
          # nothing from the smoke test goes to users: its logs and Python caches are removed first
          Remove-Item -Force AssetTrack/run_out.txt, AssetTrack/run_err.txt -ErrorAction SilentlyContinue
          Get-ChildItem -Recurse -Directory AssetTrack/server -Filter __pycache__ | Remove-Item -Recurse -Force
          Compress-Archive -Force -Path AssetTrack/* -DestinationPath AIS_AssetTrack_Server_Portable.zip
      - uses: actions/upload-artifact@v4
        with: { name: server-portable, path: AIS_AssetTrack_Server_Portable.zip }

  hht-apk:
    permissions: { contents: write }      # attach the APK to the GitHub release
    needs: server
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/hht-v') || github.ref == 'refs/heads/main'
    defaults: { run: { working-directory: hht } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - name: Accept Android SDK licences (SDK is pre-installed on ubuntu runners)
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
      - run: npm ci --no-audit --no-fund        # exact versions from package-lock.json
      - name: Prebuild native project
        run: npx expo prebuild -p android --no-install
      - name: ARM devices only (HHTs / phones) - drops emulator x86 libraries, keeps the APK small
        run: |
          sed -i 's/^reactNativeArchitectures=.*/reactNativeArchitectures=armeabi-v7a,arm64-v8a/' android/gradle.properties
          printf '\nandroid { defaultConfig { ndk { abiFilters "armeabi-v7a", "arm64-v8a" } } }\n' >> android/app/build.gradle
          grep -q "Latin model only" <(node scripts/patch-mlkit-latin.js) && echo "OCR: Latin model only"
          grep -q 'usesCleartextTraffic="true"' android/app/src/main/AndroidManifest.xml && echo "HTTP to the AssetTrack server allowed" || (echo "usesCleartextTraffic missing - HHT could not reach the server over http"; exit 1)
      - name: Build release APK (debug-signed; replace with keystore secrets for store release)
        env: { GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx4g }
        run: cd android && chmod +x gradlew && ./gradlew assembleRelease --no-daemon --stacktrace
      - name: Rename APK (version from app.json so the server can announce it)
        run: |
          V=$(node -p "require('./app.json').expo.version")
          cp android/app/build/outputs/apk/release/app-release.apk ../AIS_AssetTrack_HHT_v${V}.apk
          echo "V=$V" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v4
        with: { name: hht-apk, path: AIS_AssetTrack_HHT_*.apk }


  server-iis:
    # The portable zip installed on IIS + SQL Server Express exactly as IT would do it (iis\Setup_IIS.ps1, Windows PowerShell 5.1),
    # with both IIS modules AssetTrack supports. Then used: sign in, change password, add a plant, restart, data kept, update run.
    needs: server-portable
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix: { module: [httpplatformhandler, aspnetcoremodule] }
    steps:
      - uses: actions/download-artifact@v4
        with: { name: server-portable }
      - name: Unzip into a folder of its own
        shell: powershell
        run: Expand-Archive AIS_AssetTrack_Server_Portable.zip C:\AssetTrack_IIS
      - name: IIS and the IIS module
        shell: powershell
        run: |
          $ErrorActionPreference = "Continue"
          Install-WindowsFeature Web-Server, Web-Mgmt-Console | Out-Null
          $hph = Join-Path $env:windir "System32\inetsrv\httpPlatformHandler.dll"
          $ancm = Join-Path $env:ProgramFiles "IIS\Asp.Net Core Module\V2\aspnetcorev2.dll"
          $want = if ("${{ matrix.module }}" -eq "httpplatformhandler") { $hph } else { $ancm }
          $pkg = if ("${{ matrix.module }}" -eq "httpplatformhandler") { "httpplatformhandler" } else { "dotnet-8.0-windowshosting" }
          $out = choco install $pkg -y --no-progress 2>&1; $out | Select-Object -Last 5 | ForEach-Object { Write-Host $_ }
          if (-not (Test-Path $want)) {                     # once more, forced (runner images change)
            Write-Host "module not found after choco - retry forced"
            $out = choco install $pkg -y --no-progress --force 2>&1; $out | Select-Object -Last 5 | ForEach-Object { Write-Host $_ }
          }
          if (-not (Test-Path $want) -and "${{ matrix.module }}" -ne "httpplatformhandler") {   # official Microsoft download
            Write-Host "ASP.NET Core hosting bundle from aka.ms"
            Invoke-WebRequest "https://aka.ms/dotnet/8.0/dotnet-hosting-win.exe" -OutFile "$env:TEMP\hosting.exe" -UseBasicParsing
            Start-Process "$env:TEMP\hosting.exe" -ArgumentList "/install", "/quiet", "/norestart" -Wait
          }
          if (-not (Test-Path $want)) {
            $log = Get-Content "C:\ProgramData\chocolatey\logs\chocolatey.log" -Tail 40 -ErrorAction SilentlyContinue
            Write-Output ("::error::IIS module $pkg not installed on this runner (" + [Environment]::OSVersion.VersionString + ")%0A" + (($out | Select-Object -Last 20) + $log -join "%0A"))
            exit 1
          }
          Write-Host "IIS module ok: $want"
          iisreset | Out-Null
          exit 0
      - name: SQL Server Express and ODBC Driver 18
        shell: powershell
        run: |
          $ErrorActionPreference = "Continue"
          function Have-Sql { [bool](Get-Service 'MSSQL$SQLEXPRESS' -ErrorAction SilentlyContinue) }
          function Have-Odbc { Test-Path "HKLM:\SOFTWARE\ODBC\ODBCINST.INI\ODBC Driver 18 for SQL Server" }
          $out = @()
          if (-not (Have-Sql)) { $out += choco install sql-server-express -y --no-progress 2>&1 }
          if (-not (Have-Sql)) { Write-Host "SQL Express not found - retry forced"; $out += choco install sql-server-express -y --no-progress --force 2>&1 }
          if (-not (Have-Odbc)) { $out += choco install sqlserver-odbcdriver -y --no-progress 2>&1 }
          if (-not (Have-Odbc)) { Write-Host "ODBC 18 not found - retry forced"; $out += choco install sqlserver-odbcdriver -y --no-progress --force 2>&1 }
          Get-ChildItem "HKLM:\SOFTWARE\ODBC\ODBCINST.INI" | Select-Object -ExpandProperty PSChildName
          if (-not (Have-Sql) -or -not (Have-Odbc)) {
            $log = Get-Content "C:\ProgramData\chocolatey\logs\chocolatey.log" -Tail 40 -ErrorAction SilentlyContinue
            Write-Output ("::error::SQL Express ($(Have-Sql)) / ODBC 18 ($(Have-Odbc)) not installed on this runner%0A" + ((($out | Select-Object -Last 20) + $log) -join "%0A"))
            exit 1
          }
          Start-Service 'MSSQL$SQLEXPRESS' -ErrorAction SilentlyContinue
          Get-Service 'SQLBrowser' -ErrorAction SilentlyContinue | Set-Service -StartupType Automatic -PassThru | Start-Service -ErrorAction SilentlyContinue
          Write-Host "SQL Express and ODBC Driver 18 ok"
          exit 0
      - name: Setup_IIS.ps1 (as IT runs it)
        shell: powershell
        run: |
          $ErrorActionPreference = "Continue"
          powershell -ExecutionPolicy Bypass -File C:\AssetTrack_IIS\iis\Setup_IIS.ps1 -SqlServer ".\SQLEXPRESS" -CreateDatabase -StopDefaultSite -PublicName assettrack *>&1 | Tee-Object -FilePath C:\setup_out.txt
          if ($LASTEXITCODE) {
            $t = (Get-Content C:\setup_out.txt | Select-Object -Last 60) -join "%0A"
            Write-Output "::error::$t"; exit 1
          }
      - name: Use it - sign in, change password, add a plant, restart, data kept
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $u = "http://localhost"
          if ((Invoke-WebRequest "$u/" -UseBasicParsing).StatusCode -ne 200) { throw "web page" }
          if ((Invoke-WebRequest "$u/hht-setup" -UseBasicParsing).StatusCode -ne 200) { throw "hht-setup page" }
          $t = (Invoke-RestMethod -Method Post "$u/api/v1/auth/login" -ContentType "application/json" -Body '{"user_id":"admin","password":"Admin@123"}').token
          $t = (Invoke-RestMethod -Method Post "$u/api/v1/auth/change-password" -ContentType "application/json" -Headers @{Authorization="Bearer $t"} -Body '{"old_password":"Admin@123","new_password":"IisTest#2026"}').token
          Invoke-RestMethod -Method Post "$u/api/v1/plants" -ContentType "application/json" -Headers @{Authorization="Bearer $t"} -Body '{"code":"CHN","name":"Chennai"}' | Out-Null
          & "$env:windir\System32\inetsrv\appcmd.exe" recycle apppool /apppool.name:AssetTrack
          Start-Sleep -Seconds 5
          for ($i = 0; $i -lt 30; $i++) { try { $h = Invoke-RestMethod "$u/api/v1/health"; if ($h.db -eq "ok") { break } } catch { Start-Sleep 3 } }
          $t = (Invoke-RestMethod -Method Post "$u/api/v1/auth/login" -ContentType "application/json" -Body '{"user_id":"admin","password":"IisTest#2026"}').token
          $p = Invoke-RestMethod "$u/api/v1/plants" -Headers @{Authorization="Bearer $t"}
          if (-not ($p | Where-Object { $_.code -eq "CHN" })) { throw "plant not kept after restart" }
          & C:\AssetTrack_IIS\python\python.exe -c "import pyodbc; c=pyodbc.connect('DRIVER={ODBC Driver 18 for SQL Server};SERVER=.\\SQLEXPRESS;DATABASE=PalletDB;Trusted_Connection=yes;TrustServerCertificate=yes'); print('plants in SQL Server:', c.execute('select code, name from plants').fetchall())"
          if ($LASTEXITCODE) { throw "SQL check" }
          Write-Host "IIS + SQL Server installation works ($((Invoke-RestMethod "$u/api/v1/health").version))"
      - name: Migration script - a SQL database that already holds data is never overwritten
        shell: powershell
        run: |
          $ErrorActionPreference = "Continue"
          New-Item -ItemType Directory -Force C:\traydata | Out-Null
          $env:PALLET_DB_URL = "sqlite:///C:/traydata/pallet.db"; $env:PALLET_BENCH_SCHEDULER = "0"
          Push-Location C:\AssetTrack_IIS\server
          & C:\AssetTrack_IIS\python\python.exe -c "from fastapi.testclient import TestClient; from app.main import app; c=TestClient(app); c.__enter__(); print('tray-style SQLite database made')"
          Pop-Location
          Remove-Item Env:\PALLET_DB_URL
          $out = powershell -ExecutionPolicy Bypass -File C:\AssetTrack_IIS\iis\Migrate_SQLite_to_SQLServer.ps1 -SQLiteFile C:\traydata\pallet.db *>&1 | Out-String
          Write-Host $out
          if ($out -notmatch "already holds AssetTrack data") { Write-Output "::error::migration did not refuse a filled database%0A$($out -replace "`r?`n", "%0A")"; exit 1 }
          $h = Invoke-RestMethod http://localhost/api/v1/health
          if ($h.db -ne "ok") { Write-Output "::error::site not running after the refused migration"; exit 1 }
          Write-Host "refused as expected, site running again"
          exit 0
      - name: Update run - the same script again keeps web.config and the data
        shell: powershell
        run: |
          $before = Get-Content C:\AssetTrack_IIS\server\web.config -Raw
          powershell -ExecutionPolicy Bypass -File C:\AssetTrack_IIS\iis\Setup_IIS.ps1
          if ($LASTEXITCODE) { exit 1 }
          if ((Get-Content C:\AssetTrack_IIS\server\web.config -Raw) -ne $before) { throw "web.config changed by an update run" }
      - name: Logs
        if: failure()
        shell: powershell
        run: |
          $l = @()
          Get-ChildItem C:\AssetTrack_IIS\server\logs -ErrorAction SilentlyContinue | ForEach-Object { $l += "--- $($_.Name)"; $l += Get-Content $_.FullName -Tail 30 }
          if ($l) { Write-Output ("::error::" + (($l | Select-Object -Last 80) -join "%0A")) }
          choco list 2>&1 | Select-Object -Last 15 | ForEach-Object { Write-Output "::warning::$_" }
          Get-ChildItem C:\AssetTrack_IIS\server\logs -ErrorAction SilentlyContinue | ForEach-Object { Write-Host "--- $($_.Name)"; Get-Content $_.FullName -Tail 40 }
          Get-Content C:\AssetTrack_IIS\server\web.config -ErrorAction SilentlyContinue

  package:
    # ONE download with everything: portable server (tray) + IIS / SQL Server installer + HHT APK + guides. Developed by DT
    needs: [server-portable, server-exe, hht-apk]
    if: github.ref == 'refs/heads/main'
    permissions: { contents: write }
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: server-portable, path: dl }
      - uses: actions/download-artifact@v4
        with: { name: hht-apk, path: dl }
      - uses: actions/download-artifact@v4
        with: { name: server-exe, path: dl/exe/AssetTrack_Server }
      - name: Assemble the package
        run: |
          set -e
          SV=$(sed -n 's/^APP_VERSION = "\(.*\)"/\1/p' server/app/config.py)
          HV=$(node -p "require('./hht/app.json').expo.version")
          mkdir -p pkg && cd pkg
          unzip -q ../dl/AIS_AssetTrack_Server_Portable.zip
          mkdir -p HHT docs EXE
          cp -r ../dl/exe/AssetTrack_Server EXE/          # optional way C: the EXE build (only where IT has whitelisted it)
          test -f EXE/AssetTrack_Server/AssetTrack_Server.exe
          cp ../dl/AIS_AssetTrack_HHT_v${HV}.apk HHT/AIS_AssetTrack_HHT.apk
          cp ../package/README_FIRST.txt .
          cp ../docs/PORTABLE_SERVER.txt ../docs/DEPLOY_IIS_SQLSERVER.md ../docs/DEPLOY_SERVER_IT.md ../docs/CUSTOMER_HHT_ACCESS.md \
             ../docs/Customer_Return_Slip_API.md ../docs/VERSION_CONTROL.md ../docs/Pallet_Tracking_Master_Template_v0.4.xlsx \
             ../docs/AssetTrack_HHT_Screens_and_Challan.pdf ../BUILD_AND_DEPLOY.md ../LICENSE docs/
          cp ../server/CHANGELOG.md docs/CHANGELOG.md
          printf 'AIS AssetTrack package\r\nServer %s\r\nHHT app %s\r\nBuilt %s from commit %s\r\nDeveloped by DT\r\n' "$SV" "$HV" "$(date -u +%d-%b-%Y)" "${GITHUB_SHA::7}" > VERSION.txt
          test -f START_ASSETTRACK.bat && test -f iis/Setup_IIS.ps1 && test -f python/python.exe && test -f server/run.py
          test ! -f server/web.config && test ! -f server/pallet.db && test ! -f server/secret.key
          zip -q -r -9 ../AIS_AssetTrack_Package.zip .
          cd .. && unzip -l AIS_AssetTrack_Package.zip | tail -1
          echo "SV=$SV" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v4
        with: { name: package, path: AIS_AssetTrack_Package.zip }

  release:
    # Publishes each GitHub release ONCE, complete, and only after every check passed (SQLite, SQL Server, IIS, EXE, portable, APK).
    # An existing release of the same version is never changed (HHT releases are reused while the HHT version stays). Developed by DT
    needs: [server-sqlserver, server-iis, package]
    if: github.ref == 'refs/heads/main'
    permissions: { contents: write }
    runs-on: ubuntu-latest
    env: { GH_TOKEN: "${{ github.token }}" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: package, path: dl }
      - uses: actions/download-artifact@v4
        with: { name: server-portable, path: dl }
      - uses: actions/download-artifact@v4
        with: { name: server-exe-zip, path: dl }
      - uses: actions/download-artifact@v4
        with: { name: hht-apk, path: dl }
      - name: Server release server-v<version> (Package, Portable, EXE)
        run: |
          SV=$(sed -n 's/^APP_VERSION = "\(.*\)"/\1/p' server/app/config.py)
          ls -la dl
          if gh release view "server-v$SV" >/dev/null 2>&1; then
            echo "::notice::server-v$SV already exists - not changed (raise APP_VERSION for a new release)"
          else
            gh release create "server-v$SV" --target "$GITHUB_SHA" --latest=false --title "AIS AssetTrack Server v$SV" \
              --notes "AIS AssetTrack Server v$SV. Everything in one download: AIS_AssetTrack_Package.zip (open README_FIRST.txt). Also: Portable zip (tray server, no EXE - recommended on AIS PCs; same zip installs on IIS + SQL Server) and EXE zip (only where IT has whitelisted it). Changes: server/CHANGELOG.md. Developed by DT" \
              dl/AIS_AssetTrack_Package.zip dl/AIS_AssetTrack_Server_Portable.zip dl/AIS_AssetTrack_Server_EXE.zip
          fi
      - name: HHT release hht-v<version> (only when the HHT version is new)
        run: |
          HV=$(node -p "require('./hht/app.json').expo.version")
          if gh release view "hht-v$HV" >/dev/null 2>&1; then
            echo "::notice::hht-v$HV already exists - not changed"
          else
            cp "dl/AIS_AssetTrack_HHT_v$HV.apk" dl/AIS_AssetTrack_HHT.apk
            gh release create "hht-v$HV" --target "$GITHUB_SHA" --latest --title "AIS AssetTrack HHT v$HV" \
              --notes "AIS AssetTrack HHT app v$HV. Download AIS_AssetTrack_HHT.apk (or the versioned file) and install on the HHT. Developed by DT" \
              "dl/AIS_AssetTrack_HHT_v$HV.apk" dl/AIS_AssetTrack_HHT.apk
          fi

