name: AIS AssetTrack CI
on:
  push:
    branches: [main]
    tags: ['server-v*', 'hht-v*']
  pull_request:
jobs:
  server:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: server } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: pip install -r requirements.txt pytest
      - name: Test suite (80+ end-to-end checks) - the build stops here if anything fails
        run: pytest
      - name: Import check + API smoke (SQLite, STUB integrations)
        run: |
          python -c "from app.main import app; print('import ok')"
          (python run.py > /tmp/srv.log 2>&1 &) ; sleep 5
          curl -sf http://127.0.0.1:8001/api/v1/health
          TOKEN=$(curl -sf -X POST http://127.0.0.1:8001/api/v1/auth/login -H 'Content-Type: application/json' -d '{"user_id":"admin","password":"Admin@123"}' | python -c "import sys,json;print(json.load(sys.stdin)['token'])")
          curl -sf http://127.0.0.1:8001/api/v1/plants -H "Authorization: Bearer $TOKEN"
      - name: Package server zip
        run: cd .. && zip -qr AIS_AssetTrack_Server.zip server -x "server/pallet.db*" "server/logs/*"
      - uses: actions/upload-artifact@v4
        with: { name: server-package, path: AIS_AssetTrack_Server.zip }

  server-exe:
    needs: server
    runs-on: windows-latest
    defaults: { run: { working-directory: server } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install -r requirements.txt pyinstaller pystray pillow
      - run: pyinstaller --noconfirm assettrack_server.spec
      - name: Smoke test the EXE build (import only)
        shell: pwsh
        run: |
          Copy-Item README_SERVER_EXE.txt dist/AssetTrack_Server/
          if (!(Test-Path dist/AssetTrack_Server/AssetTrack_Server.exe)) { exit 1 }
          New-Item -ItemType Directory -Force ../smoke | Out-Null
          Copy-Item -Recurse dist/AssetTrack_Server ../smoke/
          $p = Start-Process -FilePath ../smoke/AssetTrack_Server/AssetTrack_Server.exe -WorkingDirectory ../smoke/AssetTrack_Server -PassThru
          Start-Sleep -Seconds 25
          try { $r = Invoke-WebRequest -UseBasicParsing http://127.0.0.1:8001/api/v1/health; Write-Host $r.Content; $ok = $r.StatusCode -eq 200 } catch { $ok = $false; Write-Host $_ }
          Get-Content ../smoke/AssetTrack_Server/assettrack_server.log -ErrorAction SilentlyContinue
          Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
          if (-not $ok) { exit 1 }
      - uses: actions/upload-artifact@v4
        with: { name: server-exe, path: server/dist/AssetTrack_Server }

  hht-apk:
    permissions: { contents: write }      # attach the APK to the GitHub release
    needs: server
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/hht-v') || github.ref == 'refs/heads/main'
    defaults: { run: { working-directory: hht } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - name: Accept Android SDK licences (SDK is pre-installed on ubuntu runners)
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
      - run: npm install --no-audit --no-fund
      - name: Prebuild native project
        run: npx expo prebuild -p android --no-install
      - name: Build release APK (debug-signed; replace with keystore secrets for store release)
        env: { GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx4g }
        run: cd android && chmod +x gradlew && ./gradlew assembleRelease --no-daemon --stacktrace
      - name: Rename APK (version from app.json so the server can announce it)
        run: |
          V=$(node -p "require('./app.json').expo.version")
          cp android/app/build/outputs/apk/release/app-release.apk ../AIS_AssetTrack_HHT_v${V}.apk
      - uses: actions/upload-artifact@v4
        with: { name: hht-apk, path: AIS_AssetTrack_HHT_*.apk }
      - name: Fixed-name copy (permanent link .../releases/latest/download/AIS_AssetTrack_HHT.apk)
        if: startsWith(github.ref, 'refs/tags/hht-v')
        run: cp ../AIS_AssetTrack_HHT_v*.apk ../AIS_AssetTrack_HHT.apk
      - name: Attach APK to release
        if: startsWith(github.ref, 'refs/tags/hht-v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            AIS_AssetTrack_HHT_*.apk
            AIS_AssetTrack_HHT.apk
          make_latest: true
