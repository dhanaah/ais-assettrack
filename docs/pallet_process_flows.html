<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: one swimlane chart per process, stacked as print pages; lanes = actors/systems, columns = time */
:root{
  --bg:#f3f4f2; --paper:#ffffff; --fg:#1b1f1d; --mute:#5c655f; --line:#c9cfca;
  --lane:#eef0ee; --lane2:#e5e8e6; --accent:#0b5f8a; --accent-2:#d5e8f2;
  --ctrl:#b45309; --ctrl-2:#fbe7cf; --ok:#1f7a3a; --ok-2:#d9efdf; --warn:#9b1c1c; --warn-2:#f6dada;
  --ext:#5b3f9e; --ext-2:#e6def5; --doc:#4b5563; --doc-2:#e5e7eb;
  --display:"Barlow Condensed",system-ui,sans-serif; --body:"IBM Plex Sans",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#15181a; --paper:#1e2224; --fg:#e8ebe9; --mute:#9aa49e; --line:#3a4144; --lane:#22272a; --lane2:#1a1e20;
  --accent:#6ab6dd; --accent-2:#163a4e; --ctrl:#f0a450; --ctrl-2:#4a2f10; --ok:#6fcf8c; --ok-2:#1b3a26;
  --warn:#f08a8a; --warn-2:#4a1b1b; --ext:#b79ae8; --ext-2:#2e2347; --doc:#b7bec6; --doc-2:#2b3136; color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#15181a; --paper:#1e2224; --fg:#e8ebe9; --mute:#9aa49e; --line:#3a4144; --lane:#22272a; --lane2:#1a1e20;
  --accent:#6ab6dd; --accent-2:#163a4e; --ctrl:#f0a450; --ctrl-2:#4a2f10; --ok:#6fcf8c; --ok-2:#1b3a26;
  --warn:#f08a8a; --warn-2:#4a1b1b; --ext:#b79ae8; --ext-2:#2e2347; --doc:#b7bec6; --doc-2:#2b3136; color-scheme:dark }
body{background:var(--bg);color:var(--fg);font-family:var(--body);padding-inline:16px;padding-block:20px;margin:0}
.wrap{max-width:1640px;margin:0 auto;display:grid;gap:28px}
.page{background:var(--paper);border:1px solid var(--line);border-radius:6px;padding:18px 20px;break-after:page;page-break-after:always}
.page:last-child{break-after:auto;page-break-after:auto}
.head{display:flex;flex-wrap:wrap;gap:6px 20px;align-items:baseline;margin-bottom:8px}
h1{font-family:var(--display);font-weight:700;font-size:28px;margin:0;letter-spacing:.3px}
h2{font-family:var(--display);font-weight:700;font-size:24px;margin:0}
.k{font-family:var(--display);font-weight:600;font-size:15px;color:var(--mute);letter-spacing:1.5px}
.sub{color:var(--mute);font-size:13px}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:11.5px;color:var(--mute);margin-bottom:8px}
.legend span{display:inline-flex;align-items:center;gap:5px}
.sw{width:12px;height:12px;border-radius:3px;border:1.5px solid}
.sheet{overflow-x:auto}
svg{display:block;width:100%;height:auto;font-family:var(--body)}
.laneBg{fill:var(--lane)} .laneBg.alt{fill:var(--lane2)}
.laneT{font-family:var(--display);font-weight:600;font-size:14px;fill:var(--mute);letter-spacing:1px}
.n text{font-size:11.5px;fill:var(--fg)} .n .t{font-weight:600;font-size:12.5px} .n .s{fill:var(--mute);font-size:10.5px}
.step rect{fill:var(--paper);stroke:var(--fg);stroke-width:1.3}
.app rect{fill:var(--accent-2);stroke:var(--accent);stroke-width:1.3}
.ctrl polygon{fill:var(--ctrl-2);stroke:var(--ctrl);stroke-width:1.5}
.ext rect{fill:var(--ext-2);stroke:var(--ext);stroke-width:1.3;stroke-dasharray:5 3}
.ok rect{fill:var(--ok-2);stroke:var(--ok);stroke-width:1.3}
.warn rect{fill:var(--warn-2);stroke:var(--warn);stroke-width:1.3}
.doc path{fill:var(--doc-2);stroke:var(--doc);stroke-width:1.3}
.ico path{fill:none;stroke:var(--fg);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;opacity:.85}
.ext .ico path{stroke:var(--ext)} .app .ico path{stroke:var(--accent)} .warn .ico path{stroke:var(--warn)} .ok .ico path{stroke:var(--ok)} .doc .ico path{stroke:var(--doc)}
.edge{fill:none;stroke:var(--fg);stroke-width:1.4}
.edge.ext{stroke:var(--ext);stroke-dasharray:5 3} .edge.no{stroke:var(--warn)} .edge.yes{stroke:var(--ok)}
.el{font-size:10.5px;fill:var(--mute)} .el.yes{fill:var(--ok);font-weight:600} .el.no{fill:var(--warn);font-weight:600}
.notes{columns:3;column-gap:28px;font-size:12px;color:var(--fg);margin-top:10px;line-height:1.45}
.notes b{color:var(--accent)}
.foot{display:flex;justify-content:space-between;font-size:11px;color:var(--mute);margin-top:8px}
@media (max-width:900px){.notes{columns:1}}
</style>

<div class="wrap" id="root"></div>

<script>
const NS='http://www.w3.org/2000/svg';
function el(t,a,p){const e=document.createElementNS(NS,t);for(const k in a)e.setAttribute(k,a[k]);p.appendChild(e);return e}
function h(t,a,p){const e=document.createElement(t);for(const k in a)e[k]=a[k];p.appendChild(e);return e}

const LEG=[['paper','fg','Manual / scan step'],['accent-2','accent','Asset app function'],['ctrl-2','ctrl','Decision / control'],['ext-2','ext','External system (EBS · GCS · Production · Mail)'],['doc-2','doc','Document / print'],['ok-2','ok','Normal end state'],['warn-2','warn','Exception']];

/* ===== pictograms (24x24, stroke only) ===== */
const IC={
 scan:'M4 8V5a1 1 0 0 1 1-1h3M16 4h3a1 1 0 0 1 1 1v3M20 16v3a1 1 0 0 1-1 1h-3M8 20H5a1 1 0 0 1-1-1v-3M7 12h10M9 9v6M12 9v6M15 9v6',
 truck:'M2 7h11v9H2zM13 10h4l3 3v3h-7zM6 19a2 2 0 1 0 0-.1M17 19a2 2 0 1 0 0-.1',
 gate:'M3 20V4M21 20V4M7 6v14M11 6v14M15 6v14M19 6v14M3 6h18M3 12h18',
 doc:'M6 3h8l4 4v14H6zM14 3v4h4M9 12h6M9 16h6M9 8h2',
 print:'M7 8V3h10v5M5 8h14a2 2 0 0 1 2 2v6h-4v-4H7v4H3v-6a2 2 0 0 1 2-2zM7 14h10v7H7z',
 server:'M3 4h18v6H3zM3 14h18v6H3zM7 7h.1M7 17h.1',
 pallet:'M2 10h20M2 14h20M4 10v4M12 10v4M20 10v4M4 6h16v4H4z',
 mail:'M3 6h18v12H3zM3 7l9 6 9-6',
 clock:'M12 21a9 9 0 1 0 0-18 9 9 0 0 0 0 18zM12 7v5l3 2',
 factory:'M3 21V11l5 3V11l5 3V11l5 3v7H3zM17 7V3h3v8M6 17h2M11 17h2M16 17h2',
 person:'M12 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8zM4 21a8 8 0 0 1 16 0',
 tag:'M3 12V4h8l10 10-8 8L3 12zM7 8h.1',
 chart:'M3 21h18M6 17V10M11 17V5M16 17v-7M21 17v-3',
 check:'M4 12l5 5L20 7',
 warn:'M12 3l10 18H2zM12 10v5M12 18h.1',
 wh:'M3 21V9l9-5 9 5v12H3zM8 21v-8h8v8M8 17h8',
 api:'M8 7l-5 5 5 5M16 7l5 5-5 5M14 4l-4 16',
 pin:'M12 2a6 6 0 0 1 6 6c0 5-6 12-6 12S6 13 6 8a6 6 0 0 1 6-6zM12 10a2 2 0 1 0 0-4 2 2 0 0 0 0 4'
};
function pick(n){
 const s=n.lines.join(' ').toLowerCase();
 if(n.ic)return n.ic;
 if(/scan/.test(s))return 'scan';
 if(/print/.test(s))return 'print';
 if(/pdf|challan|slip|rts|mail/.test(s)&&n.type==='doc')return 'doc';
 if(/mail/.test(s))return 'mail';
 if(/gcs|gate/.test(s))return 'gate';
 if(/vehicle|truck|departs|unloading/.test(s))return 'truck';
 if(/ebs|api|sale order|invoice/.test(s))return 'api';
 if(/dashboard|report/.test(s))return 'chart';
 if(/nightly|aging|clock|days/.test(s))return 'clock';
 if(/customer/.test(s)&&n.type!=='ok')return 'person';
 if(/tag/.test(s))return 'tag';
 if(/warehouse|dock|yard/.test(s))return 'wh';
 if(/pallet|available|discontinued|held/.test(s))return 'pallet';
 if(n.type==='warn')return 'warn';
 if(n.type==='ok')return 'check';
 if(n.type==='app')return 'server';
 return null;
}
/* ===== renderer ===== */
const COLW=186,LANEH=118,LX=120,NW=166,NH=62,DH=84,PADT=12;
function render(c,idx){
 const page=h('section',{className:'page'},document.getElementById('root'));
 const head=h('div',{className:'head'},page);
 h('span',{className:'k',textContent:'PROCESS '+(idx+1)+' / '+CH.length},head);
 h('h2',{textContent:c.title},head);
 h('span',{className:'sub',textContent:c.sub||''},head);
 const lg=h('div',{className:'legend'},page);
 LEG.forEach(([f,s,l])=>{const sp=h('span',{},lg);const i=h('i',{className:'sw'},sp);i.style.background=`var(--${f})`;i.style.borderColor=`var(--${s})`;if(s==='ext')i.style.borderStyle='dashed';sp.append(l)});
 const sheet=h('div',{className:'sheet'},page);
 const cols=Math.max(...c.nodes.map(n=>n.col))+1;
 const W=LX+cols*COLW+20,H=PADT+c.lanes.length*LANEH+10;
 const svg=el('svg',{viewBox:`0 0 ${W} ${H}`,xmlns:NS,role:'img','aria-label':c.title},sheet);
 svg.style.minWidth=Math.min(W,1500)+'px';
 const d=el('defs',{},svg);const m=el('marker',{id:'ah'+idx,markerWidth:8,markerHeight:8,refX:7,refY:4,orient:'auto',markerUnits:'userSpaceOnUse'},d);el('path',{d:'M0,0 L8,4 L0,8 z',fill:'context-stroke'},m);
 c.lanes.forEach((ln,i)=>{const y=PADT+i*LANEH;el('rect',{x:10,y,width:W-20,height:LANEH-6,rx:5,class:'laneBg'+(i%2?' alt':'')},svg);
  const t=el('text',{x:22,y:y+LANEH/2+5,class:'laneT'},svg);ln.split('\n').forEach((s,j)=>{const ts=el('tspan',{x:22,dy:j?14:(ln.includes('\n')?-6:0)},t);ts.textContent=s})});
 const N={};
 c.nodes.forEach(n=>{
  const w=n.w||NW,hh=n.type==='ctrl'?DH:(n.h||NH);
  const cx=LX+n.col*COLW+COLW/2,cy=PADT+n.lane*LANEH+(LANEH-6)/2;
  const x=cx-w/2,y=cy-hh/2;const g=el('g',{class:'n '+n.type},svg);
  if(n.type==='ctrl')el('polygon',{points:`${cx},${y} ${x+w},${cy} ${cx},${y+hh} ${x},${cy}`},g);
  else if(n.type==='doc')el('path',{d:`M${x},${y} H${x+w} V${y+hh-8} Q${x+w*0.75},${y+hh-16} ${x+w/2},${y+hh-8} T${x},${y+hh-8} Z`},g);
  else el('rect',{x,y,width:w,height:hh,rx:5},g);
  const ic=n.type==='ctrl'?null:pick(n);let tx=cx;
  if(ic){const sz=20,ix=x+7,iy=cy-sz/2;const gi=el('g',{transform:`translate(${ix},${iy}) scale(${sz/24})`,class:'ico'},g);el('path',{d:IC[ic]},gi);tx=cx+11}
  const base=cy-((n.lines.length-1)*6.5)+4;
  n.lines.forEach((l,i)=>{const t=el('text',{x:tx,y:base+i*13,'text-anchor':'middle',class:(i===0?'t':'')+(l.startsWith('·')?' s':'')},g);t.textContent=l});
  N[n.id]={x,y,w,h:hh,cx,cy,lane:n.lane,col:n.col};
 });
 const P=(n,s)=>s==='r'?[n.x+n.w,n.cy]:s==='l'?[n.x,n.cy]:s==='t'?[n.cx,n.y]:[n.cx,n.y+n.h];
 c.edges.forEach(e=>{
  const a=N[e.a],b=N[e.b];let pts;
  if(e.via){pts=[P(a,e.via[0]),...e.via.slice(1,-1),P(b,e.via[e.via.length-1])]}
  else if(a.lane===b.lane&&b.col>a.col){pts=[P(a,'r'),P(b,'l')]}
  else if(a.lane===b.lane&&b.col<a.col){const yy=PADT+a.lane*LANEH+8;pts=[P(a,'t'),[a.cx,yy],[b.cx,yy],P(b,'t')]}
  else if(a.col===b.col){pts=b.lane>a.lane?[P(a,'b'),P(b,'t')]:[P(a,'t'),P(b,'b')]}
  else if(b.col>a.col){const mx=(a.x+a.w+b.x)/2;pts=[P(a,'r'),[mx,a.cy],[mx,b.cy],P(b,'l')]}
  else{const mx=(b.x+b.w+a.x)/2;pts=[P(a,'l'),[mx,a.cy],[mx,b.cy],P(b,'r')]}
  el('path',{d:'M'+pts.map(p=>p.join(',')).join(' L'),class:'edge '+(e.cls||''),'marker-end':`url(#ah${idx})`},svg);
  if(e.l){const [x1,y1]=pts[0],[x2,y2]=pts[1];const t=el('text',{x:(x1+x2)/2+(e.dx||0),y:(y1+y2)/2-5+(e.dy||0),'text-anchor':'middle',class:'el '+(e.cls||'')},svg);t.textContent=e.l}
 });
 if(c.notes){const nt=h('div',{className:'notes'},page);c.notes.forEach(n=>{const p=h('p',{},nt);p.style.margin='0 0 6px';p.innerHTML='<b>'+n[0]+'</b> '+n[1]})}
 const f=h('div',{className:'foot'},page);h('span',{textContent:'Developed by DT · Pallet Asset Tracking · Process flows v0.4 · Oct 2026'},f);h('span',{textContent:'Page '+(idx+1)+' of '+CH.length},f);
}

/* ===== charts ===== */
const CH=[

  {id:'a2',lane:1,col:1,type:'app',lines:['Validate masters','·customer active','·transporter active']},
  {id:'a3',lane:1,col:2,type:'ctrl',lines:['Available','≥ qty?']},
  {id:'a4',lane:0,col:2,type:'warn',lines:['Reject / reduce qty','·show plant availability']},
  {id:'a5',lane:1,col:3,type:'app',lines:['Build SO payload','·item = pallet type','·returnable flag']},
  {id:'a6',lane:2,col:4,type:'ext',lines:['Create Sale Order','·EBS API','·returns SO No.']},
  {id:'a7',lane:1,col:5,type:'ctrl',lines:['API','success?']},
  {id:'a8',lane:1,col:6,type:'warn',lines:['Retry queue','·3 attempts · alert admin','·Pick List stays DRAFT']},
  {id:'a9',lane:1,col:7,type:'app',lines:['Store SO No.','·Pick List status OPEN','·reserve qty (soft)']},
  {id:'a10',lane:3,col:8,type:'ok',lines:['Pick List → Dock','·visible on HHT']},
  {id:'a11',lane:2,col:7,type:'ext',lines:['Invoice / delivery','·existing EBS flow','·glass dispatch']},
 ],
 edges:[
  {a:'a1',b:'a2'},{a:'a2',b:'a3'},{a:'a3',b:'a4',cls:'no',l:'no'},{a:'a3',b:'a5',cls:'yes',l:'yes'},
  {a:'a5',b:'a6',cls:'ext',l:'POST'},{a:'a6',b:'a7',cls:'ext',l:'SO No.'},{a:'a7',b:'a8',cls:'no',l:'fail'},
  {a:'a8',b:'a5',cls:'no',l:'retry'},{a:'a7',b:'a9',via:['t',[LX+5*COLW+COLW/2,PADT+LANEH+8],[LX+7*COLW+COLW/2,PADT+LANEH+8],'t'],cls:'yes',l:'ok'},
  {a:'a9',b:'a10'},{a:'a9',b:'a11',cls:'ext',l:'SO ref'},

  ['SO payload:','Customer code, ship-to, pallet type as item, qty, returnable flag, Pick List reference in the order header for traceability.'],
  ['Invoice:','Glass invoicing stays in the existing EBS / HMIL flow. The pallet SO is linked by Pick List reference so the pallet challan can print the invoice number.'],
  ['Edit / cancel:','A Pick List can be edited only in DRAFT. After SO posting, changes go through a cancel-and-recreate so EBS and app never diverge.']]},

{title:'Dock Out-ward Scanning & Pick List Control',sub:'Every pallet leaving the plant is scanned by tag and locked to one Pick List',
 lanes:['Dock operator\n(HHT)','Asset App\nserver','Exceptions'],
 nodes:[

  {id:'b4',lane:1,col:3,type:'ctrl',lines:['Tag active','& known?']},

  {id:'b11',lane:0,col:7,type:'ctrl',lines:['Count =','Pick List qty?']},

 ],
 edges:[
  {a:'b1',b:'b2'},{a:'b2',b:'b3'},{a:'b3',b:'b4'},{a:'b4',b:'b5',cls:'no',l:'no'},{a:'b4',b:'b6',cls:'yes',l:'yes'},
  {a:'b6',b:'b7',cls:'no',l:'no'},{a:'b6',b:'b8',cls:'yes',l:'yes'},{a:'b8',b:'b9',cls:'no',l:'no'},{a:'b8',b:'b10',cls:'yes',l:'yes'},
  {a:'b10',b:'b11'},{a:'b11',b:'b2',cls:'no',l:'next pallet'},{a:'b11',b:'b12',cls:'yes',l:'yes'},{a:'b12',b:'b13'},{a:'b13',b:'b14'},

 lanes:['Dispatch','Asset App\nserver','Oracle EBS','Logistics','GCS /\nSecurity'],
 nodes:[
  {id:'c1',lane:0,col:0,type:'step',lines:['Request challan','·for READY Pick List']},
  {id:'c2',lane:1,col:1,type:'ctrl',lines:['Challan','Control']},
  {id:'c3',lane:0,col:1,type:'warn',lines:['Blocked','·not READY / already','·challaned']},
  {id:'c4',lane:1,col:2,type:'ctrl',lines:['Source','switch?']},
